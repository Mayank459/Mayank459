<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" width="960" height="180" role="img" aria-label="CodeBase pipeline: repo to AST to graph and vectors to LangGraph agents to guardrails to streamed UI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .title { font-size: 14px; font-weight: 700; fill: #e0e7ff; letter-spacing: 0.5px; }
      .foot  { font-size: 11px; fill: #a5b4fc; }
      .node  { fill: #16132e; stroke: #7c3aed; stroke-width: 1.5; animation: pulse 6s ease-in-out infinite; }
      .n1 { animation-delay: 0s; } .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; }
      .n4 { animation-delay: 3s; } .n5 { animation-delay: 4s; } .n6 { animation-delay: 5s; }
      .name  { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .sub   { font-size: 10px; fill: #a5b4fc; text-anchor: middle; }
      .link  { stroke: url(#flow); stroke-width: 2.5; stroke-dasharray: 6 6; fill: none; animation: dash 1s linear infinite; }
      .arrow { fill: #22d3ee; }
      @keyframes dash  { to { stroke-dashoffset: -12; } }
      @keyframes pulse {
        0%, 100% { stroke: #7c3aed; stroke-width: 1.5; }
        8%, 18%  { stroke: #22d3ee; stroke-width: 3; }
        30%      { stroke: #7c3aed; stroke-width: 1.5; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="178" rx="16" fill="url(#bg)" stroke="#4c1d95" stroke-width="1.5"/>

  <text x="480" y="30" class="title" text-anchor="middle">CodeBase  ·  Dual-Plane Indexing &amp; Reasoning Pipeline</text>

  <!-- connectors -->
  <path class="link" d="M140 84 H180"/> <polygon class="arrow" points="180,79 190,84 180,89"/>
  <path class="link" d="M300 84 H340"/> <polygon class="arrow" points="340,79 350,84 340,89"/>
  <path class="link" d="M460 84 H500"/> <polygon class="arrow" points="500,79 510,84 500,89"/>
  <path class="link" d="M620 84 H660"/> <polygon class="arrow" points="660,79 670,84 660,89"/>
  <path class="link" d="M780 84 H820"/> <polygon class="arrow" points="820,79 830,84 820,89"/>

  <!-- nodes -->
  <rect class="node n1" x="20"  y="52" width="120" height="64" rx="10"/>
  <text class="name" x="80"  y="80">Git Repo</text>
  <text class="sub"  x="80"  y="98">shallow clone</text>

  <rect class="node n2" x="190" y="52" width="110" height="64" rx="10"/>
  <text class="name" x="245" y="80">AST Parse</text>
  <text class="sub"  x="245" y="98">tree-sitter</text>

  <rect class="node n3" x="350" y="52" width="110" height="64" rx="10"/>
  <text class="name" x="405" y="80">Graph+Vec</text>
  <text class="sub"  x="405" y="98">NetworkX·Qdrant</text>

  <rect class="node n4" x="510" y="52" width="110" height="64" rx="10"/>
  <text class="name" x="565" y="80">Agents</text>
  <text class="sub"  x="565" y="98">LangGraph RAG</text>

  <rect class="node n5" x="670" y="52" width="110" height="64" rx="10"/>
  <text class="name" x="725" y="80">Guardrails</text>
  <text class="sub"  x="725" y="98">in · out · cite</text>

  <rect class="node n6" x="830" y="52" width="110" height="64" rx="10"/>
  <text class="name" x="885" y="80">Stream UI</text>
  <text class="sub"  x="885" y="98">REST · SSE</text>

  <text x="480" y="152" class="foot" text-anchor="middle">Evals: Hit Rate@K · MRR · Faithfulness   |   Observability: Prometheus /metrics · JSON logs · tracing</text>
</svg>
